name: mpush
description: MPush client for Flutter, you can use this plugin to interact with MPush.
version: 1.2.0
homepage: https://github.com/Mumble-SRL/MPush-Flutter

environment:
  sdk: ">=3.11.5 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  android_id: ^0.5.1
  http: ^1.6.0
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mumble.mpush
        pluginClass: MpushPlugin
      ios:
        pluginClass: MpushPlugin

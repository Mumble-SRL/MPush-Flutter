name: mpush
description: MPush client for Flutter, you can use this plugin to interact with MPush.
version: 1.1.7
homepage: https://github.com/Mumble-SRL/MPush-Flutter

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  android_id: ^0.5.0
  http: ^1.6.0
  device_info_plus: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mumble.mpush
        pluginClass: MpushPlugin
      ios:
        pluginClass: MpushPlugin
